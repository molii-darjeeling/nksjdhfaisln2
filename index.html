10px;border-radius:20px;background:#ffffffe8;box-shadow:0 14px 50px #4140232e;backdrop-filter:blur(14px)}.sticky button{height:47px;border:0;border-radius:14px;background:transparent;font-weight:800}.sticky .primary{flex:1;background:var(--y)}.history{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.history button{display:flex;gap:10px;padding:14px;border:0;border-radius:18px;background:var(--paper);text-align:left}.history i{display:grid;place-items:center;width:40px;height:40px;border-radius:13px;background:#fff1a1;font-style:normal}.history b,.history small,.history span{display:block}.history small{margin:3px 0;color:var(--muted)}dialog{width:min(420px,calc(100% - 28px));border:0;border-radius:25px;padding:23px;box-shadow:0 25px 90px #3335}dialog::backdrop{background:#2223;backdrop-filter:blur(3px)}dialog h3{margin:0 0 17px;font-size:21px}dialog .field{margin-bottom:13px}dialog .save{width:100%;height:44px;border:0;border-radius:13px;background:var(--y);font-weight:800}.close{position:absolute;right:13px;top:12px;border:0;background:transparent;font-size:21px}.toast{position:fixed;z-index:99;left:50%;top:18px;transform:translateX(-50%);padding:10px 18px;border-radius:999px;background:#25261f;color:#fff;font-weight:800}.hide{display:none!important}

<body><div id="toast" class="toast hide"></div><main id="app" class="app"></main>
<dialog id="pd"><button class="close" onclick="editingProduct='';pd.close()">×</button><h3 id="ptitle">新建常用物品</h3><label class="field">物品名称<input id="pn" class="input" placeholder="例如：立牌 / 吧唧一对"></label><label class="field">本体均价（元）<input id="pp" class="input" type="number" inputmode="decimal" min="0" step=".01" placeholder="68"></label><label class="field">重量（g，可先空着）<input id="pw" class="input" type="number" inputmode="decimal" min="0" placeholder="70"></label><button id="psave" class="save" onclick="addProduct()">保存物品</button></dialog>
<dialog id="md"><button class="close" onclick="md.close()">×</button><h3>添加成员</h3><label class="field">成员名称<input id="mn" class="input" placeholder="例如：小明" onkeydown="if(event.key==='Enter')addMember()"></label><button class="save" onclick="addMember()">添加</button></dialog>
<script>
const KEY='shipping_calc_v2',id=()=>Math.random().toString(36).slice(2,9),today=()=>new Date().toISOString().slice(0,10),parcel=()=>({id:id(),name:(new Date().getMonth()+1)+'月国际团',totalWeight:0,totalFreight:0,domesticFreight:0,createdAt:today(),status:'draft',members:[]}),initial=()=>({products:[{id:'a',name:'立牌',weight:70,price:68,points:1},{id:'b',name:'徽章',weight:15,price:25,points:1},{id:'c',name:'色纸',weight:45,price:35,points:1},{id:'d',name:'挂件',weight:32,price:42,points:1}],draft:parcel(),history:[]});let S;try{S=JSON.parse(localStorage.getItem(KEY))||initial()}catch{S=initial()}let selected='',view='current';
function normalize(p){p.domesticFreight??=0;(p.members||[]).forEach(m=>{m.note??='';(m.lines||[]).forEach(l=>{l.price??=0;l.adjust??=0;l.weight??=0;l.points=1;l.qty=Math.max(1,Math.round(l.qty??1));const source=S.products.find(x=>x.id===l.productId)||S.products.find(x=>x.name===l.name);if(source&&!l.productId)l.productId=source.id;if(l.weightCustom==null)l.weightCustom=source?(+l.weight||0)>0&&(+l.weight||0)!==(+source.weight||0):true})})}function syncDefaults(p){(p.members||[]).forEach(m=>m.lines.forEach(l=>{const source=S.products.find(x=>x.id===l.productId);if(!source)return;l.name=source.name;l.price=source.price;l.points=1;if(!l.weightCustom)l.weight=source.weight||0}))}S.products.forEach(p=>{p.price??=0;p.weight??=0;p.points=1});normalize(S.draft);syncDefaults(S.draft);S.history.forEach(normalize);let editingProduct='';
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),M=n=>'¥'+R2(n).toFixed(2),R2=n=>Math.round((Number(n)||0)*100)/100,G=n=>R2(n).toFixed(2)+'g',mw=m=>R2(m.lines.reduce((a,l)=>a+(+l.weight||0)*l.qty,0)),mb=m=>R2(m.lines.reduce((a,l)=>a+Math.max(0,(+l.price||0)+(+l.adjust||0))*l.qty,0)),mp=m=>m.lines.reduce((a,l)=>a+l.qty,0),nw=p=>R2(p.members.reduce((a,m)=>a+mw(m),0));
function allocate(total,ws,d){const f=10**d,u=Math.round(total*f),sum=ws.reduce((a,b)=>a+b,0);if(!sum)return ws.map(()=>0);const raw=ws.map(w=>u*w/sum),out=raw.map(Math.floor),order=raw.map((v,i)=>[i,v%1]).sort((a,b)=>b[1]-a[1]),r=u-out.reduce((a,b)=>a+b,0);for(let i=0;i<r;i++)out[order[i%order.length][0]]++;return out.map(v=>v/f)}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}function toast(t){toast.el=toast.el||document.getElementById('toast');toast.el.textContent=t;toast.el.classList.remove('hide');clearTimeout(toast.t);toast.t=setTimeout(()=>toast.el.classList.add('hide'),1900)}function dirty(){S.draft.status='draft';save();const b=document.getElementById('badge');if(b){b.className='status';b.textContent='录入中'}}
function liveSummary(){const p=S.draft,n=nw(p),pack=R2(p.totalWeight?p.totalWeight-n:0);[['sn',G(n)],['sp',p.totalWeight?G(pack):'--'],['sr',p.totalWeight?M(p.totalFreight/p.totalWeight):'--']].forEach(([i,t])=>{const e=document.getElementById(i);if(e)e.textContent=t})}
function setP(k,v){S.draft[k]=v;dirty();liveSummary()}function dialog(x){x.showModal();setTimeout(()=>x.querySelector('input').focus(),20)}
function openProduct(x=''){editingProduct=x;const p=S.products.find(p=>p.id===x);pn.value=p?.name||'';pp.value=p?.price||'';pw.value=p?.weight||'';ptitle.textContent=p?'编辑物品':'新建常用物品';psave.textContent=p?'保存修改':'保存物品';dialog(pd)}function addProduct(){const n=pn.value.trim(),price=+pp.value||0,w=+pw.value||0;if(!n)return toast('请填写物品名称');const old=S.products.find(p=>p.id===editingProduct);let synced=0;if(old){const oldName=old.name;Object.assign(old,{name:n,price,weight:w,points:1});S.draft.members.forEach(m=>m.lines.forEach(l=>{if(l.productId===old.id||(!l.productId&&l.name===oldName)){l.productId=old.id;l.name=n;l.price=price;l.points=1;if(!l.weightCustom)l.weight=w;synced++}}))}else S.products.push({id:id(),name:n,price,weight:w,points:1});editingProduct='';pd.close();dirty();render();toast(old?`物品已修改，同步 ${synced} 条明细`:'物品已保存')}function delProduct(x){S.products=S.products.filter(p=>p.id!==x);save();render()}
function addMember(){const n=mn.value.trim();if(!n)return toast('请填写成员名称');const x=id();S.draft.members.push({id:x,name:n,lines:[]});selected=x;mn.value='';md.close();dirty();render()}function choose(x){selected=x;render()}function rename(x,v){const m=S.draft.members.find(m=>m.id===x);if(m)m.name=v;dirty()}function delMember(x){if(!confirm('确定删除这位成员吗？'))return;S.draft.members=S.draft.members.filter(m=>m.id!==x);selected=S.draft.members[0]?.id||'';dirty();render()}
function addItem(mid,pid){const m=S.draft.members.find(m=>m.id===mid),p=S.products.find(p=>p.id===pid);if(m&&p)m.lines.push({id:id(),productId:p.id,name:p.name,weight:p.weight||0,weightCustom:false,price:p.price||0,adjust:0,points:1,qty:1,note:''});dirty();render()}function removeLine(mid,lid){const m=S.draft.members.find(m=>m.id===mid);if(!m)return;m.lines=m.lines.filter(l=>l.id!==lid);dirty();render()}function q(mid,lid,d){const l=S.draft.members.find(m=>m.id===mid)?.lines.find(l=>l.id===lid);if(!l)return;l.qty=Math.max(1,l.qty+d);dirty();render()}function qtySet(mid,lid,v){const l=S.draft.members.find(m=>m.id===mid)?.lines.find(l=>l.id===lid);if(!l)return;l.qty=Math.max(1,Math.round(+v||1));dirty()}function qtyControl(mid,l){return`<label class="mini">数量<span class="qty stepper"><button onclick="q('${mid}','${l.id}',-1)">−</button><input class="stepinput" type="number" inputmode="numeric" min="1" step="1" value="${l.qty}" oninput="qtySet('${mid}','${l.id}',this.value)" onchange="this.value=Math.max(1,Math.round(+this.value||1));render()"><button onclick="q('${mid}','${l.id}',1)">＋</button></span></label>`}function bump(mid,lid,k,d){const l=S.draft.members.find(m=>m.id===mid)?.lines.find(l=>l.id===lid);if(!l)return;const next=(+l[k]||0)+d;l[k]=k==='weight'?Math.max(0,Math.round(next*100)/100):Math.round(next*2)/2;if(k==='weight')l.weightCustom=true;dirty();render()}function lineSet(mid,lid,k,v){const l=S.draft.members.find(m=>m.id===mid)?.lines.find(l=>l.id===lid);if(l){l[k]=k==='weight'?Math.max(0,+v||0):v;if(k==='weight')l.weightCustom=true}dirty()}function note(mid,lid,v){lineSet(mid,lid,'note',v)}
function result(){const p=S.draft,ws=p.members.map(mw),pts=p.members.map(mp),missing=p.members.some(m=>m.lines.some(l=>(+l.weight||0)<=0)),ready=!missing&&ws.reduce((a,b)=>a+b,0)>0,islandReady=!p.domesticFreight||pts.reduce((a,b)=>a+b,0)>0;return{ws,pts,ready,missing,islandReady,fees:ready?allocate(p.totalFreight,ws,2):ws.map(()=>0),charged:ready?allocate(p.totalWeight,ws,0):ws.map(()=>0),island:islandReady?allocate(p.domesticFreight,pts,2):pts.map(()=>0)}}function text(m){return m.lines.map(l=>(l.note?l.note:'')+l.name+' ×'+l.qty).join('、')||'--'}
function saveGroup(message='整团已保存'){const p=S.draft;p.name=p.name.trim()||'未命名团';if(p.status!=='final')p.status='saved';S.history=[JSON.parse(JSON.stringify(p)),...S.history.filter(x=>x.id!==p.id)];save();render();toast(message)}
function finish(){const p=S.draft,n=nw(p),r=result();if(!r.islandReady)return toast('已填写岛内运费，请先给物品设置点数');if(p.totalWeight<=0||p.totalFreight<=0)return toast('本体和岛内已可用；结算国际前请填写包裹数据');if(!p.members.length||!n)return toast('请先添加成员和物品重量');if(r.missing)return toast('还有物品未填重量，补完后才能分摊国际');if(n>p.totalWeight)return toast('物品净重超过包裹总重');p.status='final';saveGroup('本体、岛内与国际均已结算并保存')}function fresh(){const p=S.draft;if(p.status==='draft'&&(p.members.length||p.totalWeight||p.totalFreight||p.domesticFreight)&&!confirm('当前团还没保存，确定开启新团吗？'))return;S.draft=parcel();selected='';view='current';save();render()}function again(){S.draft.status='draft';save();render()}function load(x){const found=S.history.find(p=>p.id===x);if(!found)return;S.draft=JSON.parse(JSON.stringify(found));normalize(S.draft);selected=S.draft.members[0]?.id||'';view='current';save();render()}
async function copyTable(){const p=S.draft,{ws,pts,fees,island,ready}=result(),a=p.members.map((m,i)=>[m.name,text(m),mb(m).toFixed(2),pts[i],island[i].toFixed(2),ws[i]+'g',ready?fees[i].toFixed(2):'待补重量',(mb(m)+island[i]+(ready?fees[i]:0)).toFixed(2)].join('\t'));await navigator.clipboard.writeText(['成员\t物品\t本体\t点数\t岛内\t净重\t国际\t应付合计',...a].join('\n'));toast('完整表已复制')}
function downloadCsv(kind){const p=S.draft,{ws,pts,fees,charged,island,ready}=result(),Q=v=>'"'+String(v).replaceAll('"','""')+'"';let heads,rows,label;if(kind==='body'){heads=['成员','物品','本体(元)','点数','岛内运费(元)','本体+岛内(元)'];rows=p.members.map((m,i)=>[m.name,text(m),mb(m).toFixed(2),pts[i],island[i].toFixed(2),(mb(m)+island[i]).toFixed(2)]);label='本体及岛内表'}else if(kind==='intl'){heads=['成员','物品','净重(g)','分摊包装(g)','计费重量(g)','国际运费(元)'];rows=p.members.map((m,i)=>[m.name,text(m),ws[i],ready?Math.max(0,charged[i]-ws[i]):'待补重量',ready?charged[i]:'待补重量',ready?fees[i].toFixed(2):'待补重量']);label='国际运费表'}else{heads=['成员','物品','本体(元)','点数','岛内运费(元)','净重(g)','分摊包装(g)','国际运费(元)','应付合计(元)'];rows=p.members.map((m,i)=>[m.name,text(m),mb(m).toFixed(2),pts[i],island[i].toFixed(2),ws[i],ready?Math.max(0,charged[i]-ws[i]):'待补重量',ready?fees[i].toFixed(2):'待补重量',(mb(m)+island[i]+(ready?fees[i]:0)).toFixed(2)]);label='完整表'}const csv='\ufeff'+heads.map(Q).join(',')+'\n'+rows.map(r=>r.map(Q).join(',')).join('\n'),b=new Blob([csv],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download=(p.name||'未命名团')+'-'+label+'.csv';l.click();URL.revokeObjectURL(u);toast(label+'已导出')}
function header(){return`<header class="head"><div><p class="eyebrow">GROUP SHIPPING</p><h1>国际运费计算器</h1></div><nav class="nav"><button class="${view==='current'?'on':''}" onclick="view='current';render()">当前开团</button><button class="${view==='history'?'on':''}" onclick="view='history';render()">历史记录</button></nav></header>`}
function history(){return`<section class="card"><div class="top"><div><p class="eyebrow">已保存</p><h2>历史包裹</h2></div></div>${S.history.length?`<div class="history">${S.history.map(p=>`<button onclick="load('${p.id}')"><i>▣</i><span><b>${E(p.name)}</b><small>${p.createdAt} · ${p.members.length}人</small><span>${p.totalWeight}g · ${M(p.totalFreight)}</span></span></button>`).join('')}</div>`:`<div class="empty"><div><b>还没有历史包裹</b>完成分摊后会保存在这里</div></div>`}</section>`}
function render(){
 const p=S.draft,n=nw(p),pack=p.totalWeight?p.totalWeight-n:0,r=result(),{ws,pts,fees,charged,island,ready}=r,bodyTotal=p.members.reduce((a,m)=>a+mb(m),0),pointTotal=pts.reduce((a,b)=>a+b,0),active=p.members.find(m=>m.id===selected)||p.members[0];
 if(active&&!selected)selected=active.id;let h=header();if(view==='history'){app.innerHTML=h+history();return}
 h+=`<div class="grid"><section class="card"><div class="top"><div style="min-width:0;flex:1"><p class="eyebrow">当前开团</p><div class="title-row"><input class="title-input" value="${E(p.name)}" aria-label="团名" title="点击修改团名" oninput="setP('name',this.value)"><span class="title-pencil">✎</span></div></div><span id="badge" class="status ${p.status!=='draft'?'done':''}">${p.status==='final'?'已完成':p.status==='saved'?'已保存':'录入中'}</span></div><div class="fields"><label class="field">包裹总重量<div class="wrap"><input class="input" type="number" inputmode="decimal" min="0" value="${p.totalWeight||''}" placeholder="12000" oninput="setP('totalWeight',+this.value)" onchange="render()"><b class="suffix">g</b></div></label><label class="field">总国际运费<div class="wrap"><b class="prefix">¥</b><input class="input" style="padding-left:38px" type="number" inputmode="decimal" min="0" step=".01" value="${p.totalFreight||''}" placeholder="600.00" oninput="setP('totalFreight',+this.value)" onchange="render()"></div></label><label class="field">岛内运费总额<div class="wrap"><b class="prefix">¥</b><input class="input" style="padding-left:38px" type="number" inputmode="decimal" min="0" step=".01" value="${p.domesticFreight||''}" placeholder="120.00" oninput="setP('domesticFreight',+this.value)" onchange="render()"></div></label></div><div class="stats"><div class="stat"><small>本体合计</small><b class="bodytotal">${M(bodyTotal)}</b></div><div class="stat"><small>全团点数</small><b>${pointTotal}</b></div><div class="stat"><small>物品净重</small><b id="sn">${n}g</b></div><div class="stat"><small>待分摊包装</small><b id="sp">${p.totalWeight?pack+'g':'--'}</b></div></div><div class="hint"><b>岛内按点数 · 国际按重量</b><small>本体可先结算；重量以后再补也可以</small></div></section><section class="card"><div class="top"><div><p class="eyebrow">常用物品</p><h2>物品库</h2></div><button class="add" onclick="openProduct()">＋ 新建</button></div><div class="products">${S.products.map(x=>`<div class="product"><button class="editp" title="编辑物品" aria-label="编辑物品" onclick="openProduct('${x.id}')">✎</button><span><b>${E(x.name)}</b><small>${M(x.price)} · ${x.weight?G(x.weight):'未填重量'}</small></span><button class="x" title="删除物品" aria-label="删除物品" onclick="delProduct('${x.id}')">×</button></div>`).join('')}</div></section></div>`;
 h+=`<section class="card members"><div class="top"><div><p class="eyebrow">成员明细</p><h2>${p.members.length?p.members.length+' 位成员':'还没有添加成员'}</h2></div><button class="add" onclick="dialog(md)">＋ 添加成员</button></div>${!p.members.length?`<div class="empty"><div><b>添加第一位成员</b>再给成员添加购买的物品</div></div>`:`<div class="workspace"><aside class="roster">${p.members.map((m,i)=>`<button class="person ${active?.id===m.id?'on':''}" onclick="choose('${m.id}')"><span class="n">${i+1}</span><span><b>${E(m.name)}</b><small>本体 ${M(mb(m))} · ${pts[i]}点</small></span></button>`).join('')}</aside>${active?`<article class="editor"><div class="memberhead"><span class="avatar">${E(active.name.slice(0,1))}</span><div class="meta"><input value="${E(active.name)}" oninput="rename('${active.id}',this.value)" onchange="render()"><small>本体 ${M(mb(active))} · 岛内 ${M(island[p.members.indexOf(active)])} · ${G(mw(active))}</small></div><button class="trash" onclick="delMember('${active.id}')">删除</button></div><div class="lines">${active.lines.map(l=>`<div class="line"><div class="lineinfo"><b>${E((l.note||'')+l.name)}</b><span class="lineprice">单价 ${M(Math.max(0,(+l.price||0)+(+l.adjust||0)))}</span><input value="${E(l.note)}" placeholder="物品备注，例如：A角色" oninput="note('${active.id}','${l.id}',this.value)"><div class="linefields"><label class="mini">均价<input class="miniinput" type="number" value="${l.price||''}" tabindex="-1" readonly></label><label class="mini">调价 ±<span class="stepper"><button onclick="bump('${active.id}','${l.id}','adjust',-.5)">−</button><input class="stepinput" type="number" inputmode="decimal" step=".5" value="${l.adjust||0}" oninput="lineSet('${active.id}','${l.id}','adjust',+this.value)" onchange="render()"><button onclick="bump('${active.id}','${l.id}','adjust',.5)">＋</button></span></label><label class="mini">重量 g<span class="stepper"><button onclick="bump('${active.id}','${l.id}','weight',-1)">−</button><input class="stepinput" type="number" inputmode="decimal" min="0" step="1" value="${l.weight||''}" placeholder="—" oninput="lineSet('${active.id}','${l.id}','weight',this.value)" onchange="render()"><button onclick="bump('${active.id}','${l.id}','weight',1)">＋</button></span></label></div></div></div>`).join('')||`<div class="empty" style="min-height:100px">从下方点选物品</div>`}</div><div class="quick">${S.products.map(x=>`<button onclick="addItem('${active.id}','${x.id}')">＋ ${E(x.name)}</button>`).join('')}</div></article>`:''}</div>`}</section>`;
 if(p.members.length)h+=`<section class="card result"><div class="top"><div><p class="eyebrow">分开结算</p><h2>本体 / 岛内 / 国际</h2></div><div class="tools"><button onclick="downloadCsv('body')">导出本体表</button><button onclick="downloadCsv('intl')">导出国际表</button><button onclick="downloadCsv('all')">导出完整表</button></div></div><div class="tablebox"><table style="min-width:930px"><thead><tr><th>成员</th><th>物品</th><th>本体</th><th>点数</th><th>岛内</th><th>净重</th><th>分摊包装</th><th>国际</th><th>应付合计</th></tr></thead><tbody>${p.members.map((m,i)=>`<tr><td><b>${E(m.name)}</b></td><td>${E(text(m))}</td><td><b>${M(mb(m))}</b></td><td>${pts[i]}</td><td>${M(island[i])}</td><td>${ws[i]}g</td><td>${ready?Math.max(0,charged[i]-ws[i])+'g':'--'}</td><td class="${ready?'':'notready'}">${ready?M(fees[i]):'待补重量'}</td><td><b>${M(mb(m)+island[i]+(ready?fees[i]:0))}</b></td></tr>`).join('')}</tbody><tfoot><tr><td colspan="2">合计</td><td>${M(bodyTotal)}</td><td>${pointTotal}</td><td>${M(p.domesticFreight)}</td><td>${n}g</td><td>${ready?Math.max(0,pack)+'g':'--'}</td><td>${ready?M(p.totalFreight):'待结算'}</td><td>${M(bodyTotal+p.domesticFreight+(ready?p.totalFreight:0))}</td></tr></tfoot></table></div><button class="outline" onclick="copyTable()">复制完整表</button></section>`;
 h+=`<div class="sticky">${p.status==='final'?`<button onclick="again()">继续修改</button><button onclick="saveGroup()">保存整团</button><button class="primary" onclick="fresh()">开启新团</button>`:`<button onclick="fresh()">开启新团</button><button onclick="saveGroup()">保存整团</button><button class="primary" onclick="finish()">完成全部结算</button>`}</div>`;app.innerHTML=h;liveSummary();app.querySelectorAll('input[oninput*="adjust"]').forEach(x=>x.step='.5');app.querySelectorAll('.linefields .miniinput').forEach(x=>x.classList.add('locked'));if(active)app.querySelectorAll('.lines > .line').forEach((x,i)=>{const l=active.lines[i];if(!l)return;x.querySelector('.linefields')?.insertAdjacentHTML('beforeend',qtyControl(active.id,l));const b=document.createElement('button');b.className='line-delete';b.textContent='删除';b.onclick=()=>removeLine(active.id,l.id);x.append(b)})
}render();
</script></body></html>
